{{- if .Values.internalAuthorizationPolicy.enabled -}}
{{- $namespace := .Release.Namespace -}}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "service-base.fullname" . }}-internal-rpc
  labels:
{{ include "service-base.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
{{ include "service-base.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - to:
        - operation:
            notPaths:
{{- range .Values.internalAuthorizationPolicy.rules }}
{{- range .paths }}
              - {{ . | quote }}
{{- end }}
{{- end }}
{{- range .Values.internalAuthorizationPolicy.rules }}
    - from:
{{- if .serviceAccounts }}
        - source:
            principals:
{{- range .serviceAccounts }}
              - cluster.local/ns/{{ .namespace | default $namespace }}/sa/{{ .name }}
{{- end }}
{{- else }}
{{ toYaml .from | nindent 8 }}
{{- end }}
      to:
        - operation:
            paths:
{{ toYaml .paths | nindent 14 }}
{{- end }}
{{- end -}}
